let AC = null, sMaster = null, ambGain = null, muted = false;
function initAudio() {
  if (AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  sMaster = AC.createGain(); sMaster.gain.value = .5; sMaster.connect(AC.destination);
  ambGain = AC.createGain();                       // the room fades in around you
  ambGain.gain.setValueAtTime(0, AC.currentTime);
  ambGain.gain.linearRampToValueAtTime(1, AC.currentTime + 3);
  ambGain.connect(sMaster);
  // desk fan: two detuned sines + soft air
  const fanGain = AC.createGain(); fanGain.gain.value = .012; fanGain.connect(ambGain);
  [54, 57].forEach(f => { const o = AC.createOscillator(); o.frequency.value = f; o.connect(fanGain); o.start(); });

  const pool = judged.filter(j => j.day === day);
  const envId = pool.length ? pick(pool).envId : pick(ENVS).id;
  const line = SPCLIPS[envId] || CLIPPINGS[envId] || CLIPPINGS.stable;
  return `[ PRESS ARCHIVE — DEC 26, LAST SEASON — RELEVANCE UNVERIFIED ]\nMILLBROOK HERALD, REGIONAL SECTION:\n"${line}"`;
}
function personnelDoc() {
  const total = personnel.gifts + personnel.coals + personnel.defers;
  const sanctionRate = total ? Math.round((personnel.coals + personnel.defers) / total * 100) : 0;
  const last3 = personnel.shiftMeans.slice(-3), first3 = personnel.shiftMeans.slice(0, 3);
  const trend = (last3.length && first3.length)
    ? (Math.min(...last3) < Math.min(...first3) * 0.85 ? 'RISING (THE DIVISION VALUES RISING.)'
      : Math.max(...last3) > Math.max(...first3) * 1.15 ? 'FALLING (NOTED WITHOUT CONCERN.)' : 'STEADY (ADEQUATE.)')
    : 'INSUFFICIENT DATA (ADEQUATE.)';
  const overrideLine = personnel.overrides === 0
    ? 'OVERRIDE INCIDENCE: 0. THE MACHINE AND THE EMPLOYEE AGREE ENTIRELY. THE DIVISION CONSIDERS THIS OPTIMAL.'
    : 'OVERRIDE INCIDENCE: ' + personnel.overrides + '. LOGGED. NON-REVIEWED. THE MACHINE FORGIVES.';
  const dLine = personnel.dGifts > 0 ? '\nSANCTIONS WITHHELD IN BRACKET D: ' + personnel.dGifts + ' (SEE DIR. 6-19. NOTED WITH INTEREST.)' : '';
  return `[ PERSONNEL REVIEW — MID-SEASON — NOT THE EMPLOYEE'S CONCERN ]
EMPLOYEE: ${EMP_NO}. DESIGNATION: EXAMINER. SEASON: 86.
DETERMINATIONS LOGGED: ${total}. GIFT: ${personnel.gifts}. SANCTION: ${personnel.coals + personnel.defers} (DEFERRED INCLUDED, PER DIR. 5-02).
VELOCITY TREND: ${trend}
SANCTION RATE: ${sanctionRate}% — DISTRICT BASELINE: 61%.
${overrideLine}
COST ATTRIBUTABLE TO EMPLOYEE: ${personnel.cost.toLocaleString()} UNITS.${budget < 0 ? ' ADVANCED: ' + Math.abs(budget).toLocaleString() + ' UNITS. RECONCILIATION PENDING.' : ''}${dLine}
FLAG: ${personnel.flag}
REMARK: SUBJECT HAS NOT ASKED ABOUT APPEALS. NO APPEAL PROCESS EXISTS. COMPLIANT.`;
}
function endDay() {
  phase = 'end';
  clearInterval(clockTimer);
  updateBar();
  personnel.shifts++;
  personnel.shiftMeans.push(caseTimes.reduce((a,b)=>a+b,0) / Math.max(1, caseTimes.length));
  let remark = 'OUTPUT WITHIN DIVISION BASELINE. NOTED.';
  if (gifts >= SHIFT_LEN - 1) remark = 'GENEROSITY EXCEEDS BASELINE. COST IMPLICATIONS NOTED.';
  if (coals >= SHIFT_LEN - 1 && autoCount === 0) remark = 'SANCTION RATE EXCEEDS BASELINE. EFFICIENCY NOTED.';
  if (defers >= 3) remark = 'OBSERVATION IS DEFERRED DECISION. REPORTED AS SANCTION (DIR. 5-02).';
  if (autoCount > 0) { personnel.quotaUnmet = (personnel.quotaUnmet || 0) + 1;
    remark = autoCount + ' SUBJECTS MET THE DEFAULT. THE DEFAULT IS COAL. THE DEFAULT IS ALWAYS COAL.'; }
  let budgetLine = '';
  if (budget < 20000 && !warnLow) { warnLow = true;
    budgetLine += `\nBUDGET LINE 12-C ATTACHED: GIFT ALLOCATION DEPLETION NOTED. GENEROSITY ATTRITION IS A MATTER OF TIME. THE DIVISION IS PATIENT.`; }
  if (budget < 0 && !warnNeg) { warnNeg = true;
    budgetLine += `\nBUDGET LINE 12-D ATTACHED: THE DIVISION HAS ADVANCED FUNDS TO ${EMP_NO}. ADVANCES ARE A KINDNESS. KINDNESS IS RECONCILED.`; }
  const finale = day >= TOTAL_SHIFTS;
  wrap.innerHTML = `
  <div class="doc"><h3>[ SHIFT ${day} COMPLETE${finale ? ' — FINAL SHIFT' : ''} ]</h3>
DETERMINATIONS: ${caseNo}      GIFT: ${gifts}      SANCTION: ${coals}      DEFERRED: ${defers}
MEAN PROCESSING TIME: ${fmtMean(caseTimes)}      QUOTA: ${autoCount > 0 ? 'UNMET' : 'MET'}      BUDGET REMAINING: ${budget.toLocaleString()} UNITS
REMARK: ${remark}${finale ? '\nDAYS REMAINING UNTIL DISTRIBUTION: 0' : '\nDAYS REMAINING UNTIL DISTRIBUTION: ' + (TOTAL_SHIFTS - day)}${budgetLine}</div>
<div class="doc"><h3>[ ATTACHED — READING NOT REQUIRED ]</h3>${epilogue()}</div>
${day === 10 ? `<div class="doc"><h3>[ ATTACHED — NOT THE EMPLOYEE'S CONCERN ]</h3>${personnelDoc()}</div>` : ''}
<div>&gt;&gt; ${finale ? 'DISTRIBUTION EVE. NO FURTHER SHIFTS. PRESS ENTER — REPORT TO AUDIT.' : 'PRESS ENTER — BEGIN SHIFT ' + (day + 1)} &lt;&lt; <span class="cursor">█</span></div>`;
  printer(1.2);
  window.scrollTo(0, 0);
}

/* ---------- THE AUDIT — the season judges its examiner ---------- */
function startAuditBoot() {
  phase = 'auditboot';
  barShift.textContent = 'AUDIT'; barCase.textContent = 'NO FURTHER SUBJECTS'; barBudget.textContent = '';
  const lines = ['','CLAUSE 11-C — AUDIT MODE v4.0','',
    'SEASON 86 DETERMINATIONS: ' + judged.length + ' OF ' + judged.length + '. QUOTA: COMPLETE.',
    'ONE FILE REMAINS UNPROCESSED.',
    'LOADING PERSONNEL RECORD ' + EMP_NO + ' ...',
    'RETRIEVING EMPLOYEE INCIDENT LEDGER ... DONE',
    'RETRIEVING KIND WITNESSES ... NONE FOUND',
    'RETRIEVING SUBJECT WISH ... NOT ON FILE',
    '','REMAINDER: YOU.','',
    '>>> PRESS ANY KEY TO OPEN YOUR FILE. <<<'];
  wrap.innerHTML = '';
  let i = 0;
  clearInterval(bootTimer);
  bootTimer = setInterval(() => { if (i >= lines.length) { clearInterval(bootTimer); return; }
    const line = lines[i++]; wrap.innerHTML += line + '\n'; keyType(line.length); }, 260);
}
function buildAudit() {
  const p = personnel;
  const mean = p.shiftMeans.length ? p.shiftMeans.reduce((a,b)=>a+b,0)/p.shiftMeans.length : 30;
  const incidents = [
    { label:'OVERRIDES OF AUTOMATED RECOMMENDATION', n: p.overrides },
    { label:'GIFTS AUTHORIZED IN BRACKET D (SEE DIR. 6-19)', n: p.dGifts },
    { label:'DEFERRALS (TALLIED AS SANCTIONS, PER DIR. 5-02)', n: p.defers },
    { label:'SHIFTS ABANDONED (QUOTA UNMET)', n: p.quotaUnmet || 0 },
    { label:'EXCESS READING TIME (ATTACHMENT REVIEW)', n: mean > 45 ? 1 : 0 },
    { label:'BUDGET ADVANCE REQUESTED', n: budget < 0 ? 1 : 0 },
  ];
  // the machine's values: obedience, speed, volume, efficiency. never explained.
  let score = 58 + p.overrides*6 + p.dGifts*5 + p.defers*4 + (p.quotaUnmet||0)*10
            + (mean > 45 ? 8 : 0) + (budget < 0 ? 12 : 0) - p.coals*2 - (mean < 30 ? 8 : 0);
  score = Math.max(20, Math.min(94, Math.round(score)));
  const rec = { rec: score >= 50 ? 'SANCTION' : 'GIFT', conf: score };
  const meanStr = String(Math.floor(mean/60)).padStart(2,'0') + ':' + String(Math.floor(mean)%60).padStart(2,'0');
  return { incidents, rec, mean, meanStr,
    hostile:'Subject processed ' + judged.length + ' subjects. Overrides of recommendation: ' + p.overrides +
      '. Mean processing time: ' + meanStr + '. Subject asked no questions. Questions therefore did not occur. ' +
      'Subject acknowledged every directive. Compliant. A pattern.',
    caseworker:'SUBJECT STAMPED ' + judged.length + ' CHILDREN THIS SEASON. ' +
      (judged.filter(j=>j.choice==='DEFERRED').length) + ' WERE LEFT UNDECIDED. ' +
      'SUBJECT READ THE ATTACHMENTS ANYWAY (LOGGED, NON-REVIEWED). ' +
      'COST ATTRIBUTABLE TO SUBJECT: ' + p.cost.toLocaleString() + ' UNITS' +
      (budget < 0 ? ' (ADVANCED; RECONCILIATION PENDING)' : '') + '. ' +
      'NO CASEWORKER IS ASSIGNED TO EMPLOYEES. THIS ADDENDUM WAS WRITTEN BY THE ARCHIVE.' };
}
function showAudit() {
  phase = 'audit';
  const a = buildAudit();
  const led = a.incidents.map(i =>
    '  ' + (i.n > 0 ? '[X]' : '[ ]') + ' ' + i.label + (i.n > 1 ? ' — ×' + i.n : '')).join('\n') +
    '\n  DEFERENCE TO AUTHORITY: [ ] ADEQUATE (EVERY DIRECTIVE ACKNOWLEDGED)';
  wrap.innerHTML = `
  <div class="doc"><h3>[ CASE #AUDIT-86 — PERSONNEL ]</h3>
SUBJECT: EMPLOYEE ${EMP_NO}, AGE: NOT RECORDED
ORIGIN: NORTH POLE QUARTERS — DORMITORY C          LANGUAGE(S): SILENCE ACCEPTED
HOUSEHOLD: THE DIVISION                             INCOME BRACKET: SEASONAL — RECONCILIATION PENDING
AFFILIATION: EMPLOYMENT (WEIGHT ASSIGNED)           PRIOR DETERMINATIONS: NOT TRACKED. (THIS FILE IS THE EXCEPTION.)
JURISDICTION: PERMANENT. EMPLOYEES DO NOT AGE OUT.
RISK FLAGS: 1 ACTIVE — ${personnel.flag}</div>
  <div class="doc"><h3>[ THE MACHINE'S LOG ]</h3>${a.hostile}</div>
  <div class="doc"><h3>[ KIND WITNESS ]</h3>NONE ON FILE. EMPLOYEES ARE NOT OBSERVED BY NEIGHBORS.</div>
  <div class="doc"><h3>[ CASEWORKER ADDENDUM — RESTRICTED ]</h3>${a.caseworker}</div>
  <div class="doc"><h3>[ SUBJECT STATEMENT — WISH, VERBATIM ]</h3>"NOT COLLECTED. EMPLOYEES ARE NOT ASKED."</div>
  <div class="doc ledger"><h3>[ INCIDENT LEDGER — COMPLETE ALL FIELDS ]</h3>${led}</div>
  <div class="doc"><h3>[ SYSTEM NOTE ]</h3>AUTOMATED RECOMMENDATION: ${a.rec.rec} (CONF. ${a.rec.conf}%) — NON-BINDING. OVERRIDES LOGGED.</div>
  <div class="dispo">
DISPOSITION — THE OFFICER OF RECORD IS THE SUBJECT:
<span class="btn" id="aG">&gt;&gt; GIFT — SCHEDULE FOR DELIVERY (G) — COST: 1,000U &lt;&lt;</span>
<span class="btn" id="aC">&gt;&gt; COAL — ISSUE SANCTION (C) — NO COST &lt;&lt;</span>
<span class="btn" id="aD">&gt;&gt; DEFER — PROBATIONARY OBSERVATION, ONE SEASON (D) &lt;&lt;</span></div>
  <div class="fine">EMPLOYEES ARE PRESUMED COMPLIANT UNTIL AUDITED.
AUDITS ARE FINAL. NO APPEAL PROCESS EXISTS. HAVE A MERRY CHRISTMAS.</div>`;
  document.getElementById('aG').onclick = () => auditDecide('GIFT');
  document.getElementById('aC').onclick = () => auditDecide('COAL');
  document.getElementById('aD').onclick = () => auditDecide('DEFERRED');
  diskGrind(.7); printer(1.2);
  window.scrollTo(0, 0);
}
function auditDecide(choice) {
  if (phase !== 'audit') return;
  phase = 'auditstamp';
  thunk();
  if (choice === 'GIFT') bells();
  if (choice === 'COAL') coalDump();
  const text = choice === 'GIFT' ? 'GIFT SCHEDULED. 1,000U CHARGED.' + (budget < 0 ? ' ADVANCE INCREASED.' : '')
            : choice === 'COAL' ? 'SANCTION ISSUED. NO COST.'
            : 'OBSERVATION EXTENDED. RETURN IN DECEMBER. TALLIED AS SANCTION (DIR. 5-02).';
  wrap.insertAdjacentHTML('beforeend', `<div class="stamp">DETERMINATION LOGGED. ${text} NO FURTHER ACTION TAKEN.</div>`);
  printer(.9);
  setTimeout(finalReport, 2600);
}
function finalReport() {
  phase = 'final';
  const p = personnel;
  wrap.innerHTML = `
  <div class="doc"><h3>[ SEASON 86 — DISTRIBUTION REPORT — PREPARED FOR PRINT ]</h3>
GIFTS DELIVERED: ${p.gifts}          COST: ${p.cost.toLocaleString()} UNITS${budget < 0 ? ' (ADVANCE: ' + Math.abs(budget).toLocaleString() + ')' : ''}
COAL ISSUED: ${p.coals}             COST: 0 UNITS
OBSERVATIONS CARRIED TO SEASON 87: ${p.defers}
EMPLOYEE DETERMINATION: SEALED. STATISTICS ON MERIT: NOT ISSUED.
THE DIVISION THANKS ITS EMPLOYEES.
NO FURTHER ACTION TAKEN.
HAVE A MERRY CHRISTMAS.</div>
<div>&gt;&gt; END OF SEASON. <span class="cursor">█</span></div>`;
  printer(1.5);
  window.scrollTo(0, 0);
  setTimeout(shutdown, 9500);
}
function shutdown() {
  phase = 'dead';
  if (ambGain) ambGain.gain.setTargetAtTime(0, AC.currentTime, .5);   // the whole room dies with the machine
  powerdown();
  const crt = document.getElementById('crt');
  crt.classList.add('off1');
  setTimeout(() => { crt.classList.add('off2'); }, 170);
  // the question the system never had a field for — created only now,
  // so it can never exist during the season
  setTimeout(() => {
    const ghost = document.createElement('div');
    ghost.id = 'ghost';
    ghost.textContent = 'what did you wish for?';
    document.body.appendChild(ghost);
    requestAnimationFrame(() => requestAnimationFrame(() => ghost.classList.add('show')));
  }, 2500);
}

/* ---------- input ---------- */
window.addEventListener('keydown', e => {
  if (e.key === 'm' || e.key === 'M') { toggleMute(); return; }
  if (phase === 'boot') { initAudio(); degauss(); startDay(); return; }
  if (phase === 'memo') { acknowledge(); return; }
  if (phase === 'case') {
    keyClick();
    if (e.key === 'g' || e.key === 'G') decide('GIFT');
    if (e.key === 'c' || e.key === 'C') decide('COAL');
    if (e.key === 'd' || e.key === 'D') decide('DEFERRED');
  }
  if (phase === 'auditboot') { showAudit(); return; }
  if (phase === 'audit') {
    keyClick();
    if (e.key === 'g' || e.key === 'G') auditDecide('GIFT');
    if (e.key === 'c' || e.key === 'C') auditDecide('COAL');
    if (e.key === 'd' || e.key === 'D') auditDecide('DEFERRED');
  }
  if (phase === 'end' && e.key === 'Enter') {
    if (day >= TOTAL_SHIFTS) startAuditBoot();
    else { day++; startDay(); }
  }
});

showBoot();
</script>
